name: NodeLoc 每日签到

on:
  schedule:
    # 每天 UTC 16:00 触发（北京时间 00:00），脚本内随机延迟至 00:00-06:00 之间签到
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      force_checkin:
        description: '强制签到（忽略时间段限制）'
        required: false
        default: 'false'

env:
  TZ: Asia/Shanghai

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checkin script
        env:
          NODELOC_USERNAME: ${{ secrets.NODELOC_USERNAME }}
          NODELOC_PASSWORD: ${{ secrets.NODELOC_PASSWORD }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_CHECKIN: ${{ github.event.inputs.force_checkin || 'false' }}
        run: |
          python checkin.py

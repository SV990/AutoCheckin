name: NodeLoc 每日签到

on:
  schedule:
    # 每天 UTC 16:00 触发 (北京时间 00:00)
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      force_checkin:
        description: '强制签到（忽略时间段限制）'
        required: false
        default: 'false'

env:
  TZ: Asia/Shanghai

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checkin script
        env:
          NODELOC_USERNAME: ${{ secrets.NODELOC_USERNAME }}
          NODELOC_PASSWORD: ${{ secrets.NODELOC_PASSWORD }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          FORCE_CHECKIN: ${{ github.event.inputs.force_checkin == 'true' && 'true' || 'false' }}
        run: |
          python checkin.py

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-log-${{ github.run_id }}
          path: checkin.log
          if-no-files-found: ignore
